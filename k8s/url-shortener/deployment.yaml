apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
      - name: url-shortener
        image: shlinkio/shlink:stable
        env:
          - name: DB_DRIVER
            valueFrom:
              secretKeyRef:
                name: homelab-db-secret
                key: DB_DRIVER
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: homelab-db-secret
                key: DB_HOST
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: homelab-db-secret
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: homelab-db-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: homelab-db-secret
                key: DB_PASSWORD
          - name: DEFAULT_DOMAIN
            value: "localhost:30081"
          - name: IS_HTTPS_ENABLED
            value: "false"
        ports:
        - containerPort: 8080


